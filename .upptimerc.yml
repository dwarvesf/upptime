  cname: status.d.foundation
  # Uncomment the following line if you don't have a custom domain and add your repo name
  # baseUrl: /upptime
  favicon: https://git.d.foundation/uploads/-/system/appearance/favicon/1/LogoD_1024.png
  logoUrl: https://images.glints.com/unsafe/glints-dashboard.s3.amazonaws.com/company-logo/32c5b772aec460924dbe0d60ce73f1c6.png
  name: Dwarves Foundation Status
