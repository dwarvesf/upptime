# Change these first
owner: dwarvesf # Your GitHub username
repo: upptime # Your GitHub repository name
user-agent: lmquang
runner: self-hosted
# Add your sites here
sites:
  - name: Fortress API
    url: https://api.fortress.d.foundation/healthz
  - name: MCP DB
    url: https://mcp-db.mcp.d.foundation/healthz
assignees: # Users to assign downtime issues (optional)
  - lmquang
