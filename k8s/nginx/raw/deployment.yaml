apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-raw-proxy
  namespace: upptime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-raw-proxy
  template:
    metadata:
      labels:
        app: nginx-raw-proxy
    spec:
      nodeSelector:
        nodepool: development
      tolerations:
      - key: "nodepool"
        operator: "Equal"
        value: "development"
        effect: "NoSchedule"
      initContainers:
      # Init container to generate config for raw.githubusercontent.com
      - name: config-updater
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "server {
            listen 80;
            server_name proxy.local;
            location / {
              proxy_pass https://raw.githubusercontent.com/;
              proxy_set_header Host raw.githubusercontent.com;
              proxy_set_header Authorization \"Bearer $(cat /secrets/token)\";
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$scheme;
              proxy_connect_timeout 10s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
              proxy_buffering on;
              proxy_buffer_size 8k;
              proxy_buffers 4 32k;
              proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            }
            location /healthz {
              return 200;
            }
          }" > /etc/nginx/nginx.conf
        resources:
          limits:
            cpu: "10m"
            memory: "32Mi"
          requests:
            cpu: "10m"
            memory: "32Mi"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx
        - name: secret-volume
          mountPath: /secrets
      containers:
      # Nginx container for api.github.com
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
          name: api-port
        resources:
          limits:
            cpu: "50m"
            memory: "32Mi"
          requests:
            cpu: "50m"
            memory: "32Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: config-volume
        emptyDir: {}
      - name: secret-volume
        secret:
          secretName: proxy-secrets