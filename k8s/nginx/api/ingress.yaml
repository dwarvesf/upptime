apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy-api-ingress
  namespace: upptime
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:                                                                                                                    
  - hosts: 
    - proxy-api.status.d.foundation
    secretName: proxy-api.status.d.foundation-tls
  rules:
  - host: proxy-api.status.d.foundation
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-api-proxy-service
            port:
              number: 80